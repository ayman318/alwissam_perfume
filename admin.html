<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم الوسام للعطور</title><link rel="stylesheet" href="assets/css/admin.css"></head>
<body>
<section id="loginView" class="login-view"><div class="login-card"><img src="assets/images/logo.jpg" class="login-logo" alt=""><span class="eyebrow">WISSAM PERFUMES</span><h1>تسجيل دخول الأدمن</h1><p>استخدم حساب Supabase Authentication.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required></label><label>كلمة المرور<input id="password" type="password" required></label><button class="btn primary full">تسجيل الدخول</button></form><div id="loginMsg" class="message"></div></div></section>
<div id="appView" class="app-shell hidden"><aside id="sidebar" class="sidebar"><div class="side-brand"><img src="assets/images/logo.jpg" alt=""><div><b>الوسام</b><small>لوحة التحكم</small></div></div><nav><button class="nav-item active" data-section="dashboard">📊 الرئيسية</button><button class="nav-item" data-section="products">🧴 المنتجات</button><button class="nav-item" data-section="orders">📦 الطلبات</button><button class="nav-item" data-section="settings">⚙️ الإعدادات</button></nav><button id="logoutBtn" class="logout">تسجيل الخروج</button></aside>
<main class="main"><header class="topbar"><button id="menuBtn" class="icon-btn">☰</button><div><span class="eyebrow">ADMIN PANEL</span><h2 id="pageTitle">الرئيسية</h2></div><a href="index.html" class="visit-link">المتجر ↗</a></header><div id="globalMsg" class="message"></div>
<section id="section-dashboard" class="page-section active"><div class="stats"><div class="stat"><span>المنتجات</span><strong id="statProducts">0</strong></div><div class="stat"><span>الطلبات</span><strong id="statOrders">0</strong></div><div class="stat"><span>إجمالي الطلبات</span><strong id="statSales">0 جنيه</strong></div></div><div class="panel"><h3>إدارة المتجر</h3><div class="quick-grid"><button class="quick" data-go="products">🧴 إدارة المنتجات</button><button class="quick" data-go="orders">📦 الطلبات</button><button class="quick" data-go="settings">⚙️ الإعدادات</button></div></div></section>
<section id="section-products" class="page-section"><div class="section-head"><div><span class="eyebrow">PRODUCTS</span><h3>المنتجات</h3></div><button id="newProductBtn" class="btn primary">＋ إضافة منتج</button></div><div id="productsList" class="products-admin-grid"></div></section>
<section id="section-orders" class="page-section">
  <div class="section-head">
    <div><span class="eyebrow">ORDERS</span><h3>الطلبات</h3></div>
    <div style="display:flex;gap:8px;">
      <button id="refreshOrders" class="btn">🔄 تحديث</button>
      <button id="printAllOrdersBtn" class="btn" style="background:#2563eb;color:#fff;">🖨️ طباعة الكل</button>
    </div>
  </div>
  <div id="ordersList" class="orders-list"></div>
</section>
<section id="section-settings" class="page-section"><div class="panel narrow"><h3>إعدادات المتجر</h3><form id="settingsForm" class="form-grid"><label>اسم المتجر<input id="storeName" required></label><label>WhatsApp<input id="whatsapp"></label><label class="full-field">الوصف المختصر<textarea id="tagline" rows="3"></textarea></label><button class="btn primary full-field">حفظ الإعدادات</button></form></div></section>
</main></div>
<div id="productModal" class="modal"><div class="modal-card"><button class="modal-close" data-close="productModal">×</button><h3 id="productModalTitle">إضافة منتج</h3><form id="productForm"><input id="editProductId" type="hidden"><div class="form-grid"><label>اسم المنتج<input id="productName" required></label><label>القسم<select id="productCategory" required><option value="">اختر</option><option value="men">رجال</option><option value="women">نساء</option><option value="unisex">للجنسين</option><option value="original">أورجينال</option></select></label><label class="full-field">الوصف<textarea id="productDescription" rows="4"></textarea></label><label class="full-field">الصورة<input id="productImageFile" type="file" accept="image/*"><small class="hint">سيتم رفعها إلى Supabase Storage.</small><img id="imagePreview" class="image-preview hidden" alt=""></label><label class="switch-row"><input id="productActive" type="checkbox" checked> المنتج ظاهر في المتجر</label></div><button class="btn primary full" type="submit">حفظ المنتج</button></form></div></div>
<div id="sizeModal" class="modal"><div class="modal-card"><button class="modal-close" data-close="sizeModal">×</button><h3>إضافة حجم وسعر وخصم</h3><form id="sizeForm" class="form-grid"><label>الحجم<select id="sizeMl"><option value="30">30 ml</option><option value="50">50 ml</option><option value="100">100 ml</option></select></label><label>السعر<input id="sizePrice" type="number" min="0" step=".01" required></label><label class="switch-row full-field"><input id="sizeDiscountEnabled" type="checkbox"> تفعيل الخصم</label><div id="discountFields" class="form-grid full-field hidden">
<label>نسبة الخصم
  <select id="discountValue">
    <option value="5">5%</option>
    <option value="10">10%</option>
    <option value="15">15%</option>
    <option value="20">20%</option>
    <option value="25">25%</option>
    <option value="30">30%</option>
    <option value="35">35%</option>
    <option value="40">40%</option>
    <option value="45">45%</option>
    <option value="50">50%</option>
    <option value="55">55%</option>
    <option value="60">60%</option>
    <option value="65">65%</option>
    <option value="70">70%</option>
    <option value="75">75%</option>
    <option value="80">80%</option>
    <option value="85">85%</option>
    <option value="90">90%</option>
    <option value="95">95%</option>
    <option value="100">100%</option>
  </select>
</label>
</div><button class="btn primary full-field">حفظ</button></form></div></div>
<script src="assets/js/admin.js"></script></body></html>
