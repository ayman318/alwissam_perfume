<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الوسام للعطور</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="splash"><img src="assets/images/logo.jpg" alt="الوسام للعطور"></div>

<header>
  <a class="brand" href="#">
    <img src="assets/images/logo.jpg" alt="الوسام">
    <span>
      <b class="store-name">الوسام للعطور</b>
      <small class="tagline">أناقة تدوم... وعطر يميزك</small>
    </span>
  </a>

  <div class="header-actions">
    <!-- زر تتبع حالة الطلب للعميل -->
    <button class="icon-action-btn" onclick="openTrackModal()" title="تتبع حالة طلبك" aria-label="تتبع الطلب">
      <span>📍</span>
      <span class="btn-label">تتبع طلبي</span>
    </button>
    <!-- زر تبديل الوضع الليلي / النهاري -->
    <button id="themeToggle" class="theme-btn" title="تبديل المظهر" aria-label="تبديل المظهر">
      <span class="theme-icon">☀️</span>
    </button>
    <button class="cart-btn" onclick="openCart()">
      🛒 <span class="cart-text">السلة</span> <i id="cartCount">0</i>
    </button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <span class="hero-eyebrow">WISSAM PERFUMES</span>
    <h1>عطرك عنوان <em>أناقتك</em></h1>
    <p>اختار عطرك المفضل من مجموعتنا الاستثنائية بلمسات فاخرة تدوم طويلاً.</p>
    <a href="#storeControls" class="gold hero-cta">تصفح المنتجات</a>
  </div>
</section>

<!-- شريط التحكم الموحد: البحث + التصنيفات -->
<div id="storeControls" class="store-controls-wrapper">
  <div class="store-controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث باسم العطر أو الرائحة..." oninput="handleSearch()">
    </div>
    
    <nav class="cats-bar">
      <button class="active" data-cat="all">✨ الكل</button>
      <button data-cat="men">👔 رجالي</button>
      <button data-cat="women">👗 نسائي</button>
      <button data-cat="unisex">⚖️ للجنسين</button>
      <button data-cat="original">👑 أورجينال</button>
    </nav>
  </div>
</div>

<section class="title">
  <span>OUR COLLECTION</span>
  <h2>المجموعة المختارة</h2>
  <div class="title-accent"></div>
</section>

<main id="products" class="grid"></main>

<div id="modal" class="modal">
  <div class="box">
    <button class="x" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- زر واتساب العائم -->
<a id="floatingWhatsapp" class="floating-whatsapp" href="#" target="_blank" rel="noopener noreferrer" title="تحدث معنا على واتساب">

</body>
