<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تفاصيل العطر | الوسام للعطور</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>
.product-page-container{
    max-width:1050px;
    margin:35px auto 60px;
    padding:0 20px;
}

.back-nav{
    margin-bottom:22px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold-main);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    background:var(--bg-surface);
    padding:10px 20px;
    border-radius:22px;
    border:1px solid var(--border-color);
    transition:all .25s ease;
}

.back-btn:hover{
    border-color:var(--gold-main);
    transform:translateX(4px);
}

.product-layout{
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:40px;
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    border-radius:22px;
    padding:35px;
    box-shadow:var(--shadow-card);
}

.product-gallery{
    position:relative;
    text-align:center;
}

.product-gallery img{
    width:100%;
    max-height:460px;
    object-fit:cover;
    border-radius:16px;
    border:1px solid var(--border-color);
    background:var(--bg-surface-elevated);
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.product-info h1{
    margin:10px 0 14px;
    font-size:28px;
    line-height:1.3;
}

.cat-badge{
    display:inline-block;
    color:var(--gold-main);
    background:rgba(214,179,75,.12);
    border:1px solid var(--border-gold);
    padding:5px 14px;
    border-radius:16px;
    font-size:13px;
    font-weight:700;
}

.pricing-hero{
    margin:18px 0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

.pricing-hero strong{
    font-size:32px;
    color:var(--gold-main);
}

.pricing-hero del{
    color:var(--text-dim);
    font-size:17px;
}

.discount-pill{
    background:#dc2626;
    color:#fff;
    font-weight:800;
    font-size:12px;
    padding:5px 12px;
    border-radius:8px;
}

.desc-text{
    color:var(--text-muted);
    line-height:1.85;
    font-size:15px;
    margin-bottom:20px;
    border-top:1px solid var(--border-color);
    border-bottom:1px solid var(--border-color);
    padding:16px 0;
}

.sizes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.sizes button{
    background:var(--bg-surface-elevated);
    color:var(--text-main);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:12px 8px;
    cursor:pointer;
    font-family:inherit;
    min-height:68px;
    transition:all .2s ease;
}

.sizes button:hover{
    border-color:var(--border-gold);
}

.sizes button.sel{
    border-color:var(--gold-main);
    background:rgba(214,179,75,.14);
    box-shadow:0 0 10px rgba(214,179,75,.18);
}

.size-old-price{
    display:block;
    color:var(--text-dim);
    text-decoration:line-through;
    font-size:12px;
    margin-top:4px;
}

.size-final-price{
    display:block;
    color:var(--gold-main);
    font-weight:900;
    margin-top:3px;
}

.qty{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:12px;
}

.qty button{
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--border-color);
    background:var(--bg-surface-elevated);
    color:var(--text-main);
    font-size:20px;
    cursor:pointer;
    transition:background .2s;
}

.qty button:hover{
    border-color:var(--gold-main);
    color:var(--gold-main);
}

.qty b{
    font-size:20px;
}

.btn-actions-row{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn-actions-row button,
.btn-actions-row a{
    flex:1;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    border:none;
    font-family:inherit;
    text-decoration:none;
    transition:transform .2s ease, opacity .2s ease;
}

.btn-cart{
    background:var(--gold-gradient);
    color:#080808;
}

.btn-cart:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.btn-whatsapp-direct{
    background:#25d366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.share-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    border-radius:12px;
    background:var(--bg-surface-elevated);
    color:var(--gold-main);
    border:1px dashed var(--gold-main);
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    transition:background .2s;
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-size:16px;
}

#productModal{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    padding:20px;
}

#productModal.show{
    display:flex;
}

#productModal .box{
    position:relative;
    width:min(500px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--bg-surface);
    color:var(--text-main);
    border:1px solid var(--border-color);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

@media(max-width:820px){
    .product-layout{
        grid-template-columns:1fr;
        gap:25px;
        padding:20px;
    }
    .product-gallery img{
        max-height:330px;
    }
    .sizes{
        grid-template-columns:repeat(2,1fr);
    }
    .btn-actions-row{
        flex-direction:column;
    }
    .product-info h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>
<a class="brand" href="index.html">
<img src="assets/images/logo.jpg" alt="الوسام">
<span>
<b class="store-name">الوسام للعطور</b>
<small class="tagline">أناقة تدوم... وعطر يميزك</small>
</span>
</a>

<div class="header-actions">
    <!-- قائمة اختيار الثيمات -->
    <select id="themeSelector" class="custom-select-box" title="اختر الثيم المفضّل">
      <option value="dark">🌙 داكن فخم</option>
      <option value="light">☀️ كريمي ناعم</option>
      <option value="royal">💎 ملكي أزرق</option>
      <option value="emerald">🌿 زمردي أخضر</option>
    </select>

    <!-- قائمة اختيار اللغة -->
    <select id="langSelector" class="custom-select-box" title="اللغة / Language">
      <option value="ar">العربية</option>
      <option value="en">English</option>
    </select>

    <a href="index.html" class="icon-action-btn">
      🏠 <span data-i18n="store">المتجر</span>
    </a>
</div>
</header>


<div class="product-page-container">
<div class="back-nav">
<a href="index.html" class="back-btn">
← <span data-i18n="backToStore">العودة للمتجر</span>
</a>
</div>

<div id="productViewArea">
<div class="loading">
🧴 جاري تحميل تفاصيل العطر...
</div>
</div>
</div>


<footer>
© 2026
<span class="store-name">الوسام للعطور</span>
—
جميع الحقوق محفوظة
|
برمجة وتطوير
<a href="https://wa.me/201280815067" target="_blank" rel="noopener noreferrer">
✦ Ayman Abdelsanad ✦
</a>
</footer>


<script>

const API_CONFIG = {
    url: "https://dbtvicvsabdypxjhafxt.supabase.co",
    anonKey: "sb_publishable_cE_nDKgQJMBczIgGph0WbA_ekFMWxlq"
};

const headers = {
    apikey: API_CONFIG.anonKey,
    Authorization: `Bearer ${API_CONFIG.anonKey}`
};

const translations = {
    ar: {
        store: "المتجر",
        backToStore: "العودة للمتجر",
        copyLink: "🔗 نسخ رابط العطر للمشاركة",
        chooseSize: "اختر الحجم:",
        qtyText: "الكمية:",
        addToCart: "🛒 إضافة للسلة",
        buyWhatsapp: "💬 طلب فوري عبر WhatsApp",
        savedFav: "إضافة للمفضلة ❤️",
        reviewsTitle: "تقييمات وآراء العملاء"
    },
    en: {
        store: "Store",
        backToStore: "Back to Store",
        copyLink: "🔗 Copy Product Link",
        chooseSize: "Choose Size:",
        qtyText: "Quantity:",
        addToCart: "🛒 Add to Cart",
        buyWhatsapp: "💬 Quick WhatsApp Order",
        savedFav: "Add to Wishlist ❤️",
        reviewsTitle: "Customer Reviews"
    }
};

const labels = {
    men: { ar: "رجال", en: "Men" },
    women: { ar: "نساء", en: "Women" },
    unisex: { ar: "للجنسين", en: "Unisex" },
    original: { ar: "أورجينال", en: "Original" }
};

let currentLang = localStorage.getItem("wissam_lang") || "ar";
const money = n =>
    Number(n || 0).toLocaleString(currentLang === "ar" ? "ar-EG" : "en-US", {
        maximumFractionDigits: 2
    }) + (currentLang === "ar" ? " جنيه" : " EGP");

let product = null;
let currentSize = null;
let qty = 1;
let storeSettings = null;
let wishlist = JSON.parse(localStorage.getItem("wissam_wishlist") || "[]");

function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[char]));
}

function getProductImage(image){
    if(!image) return "assets/images/logo.jpg";
    let value = String(image).trim();
    if(value.startsWith("https://") || value.startsWith("http://")) return value;
    value = value.replace(/^\/+/,"");
    if(value.includes("storage/v1/object")){
        return value.startsWith("/") ? API_CONFIG.url + value : value;
    }
    return `${API_CONFIG.url}/storage/v1/object/public/product-images/${encodeURIComponent(value)}`;
}

/* =========================
   الثيمات واللغة
========================= */
function initTheme() {
    const savedTheme = localStorage.getItem("wissam_theme") || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    const themeSelector = document.getElementById("themeSelector");
    if (themeSelector) {
        themeSelector.value = savedTheme;
        themeSelector.onchange = (e) => {
            document.documentElement.setAttribute("data-theme", e.target.value);
            localStorage.setItem("wissam_theme", e.target.value);
        };
    }
}

function initLanguage() {
    document.documentElement.setAttribute("lang", currentLang);
    document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
    const langSelector = document.getElementById("langSelector");
    if (langSelector) {
        langSelector.value = currentLang;
        langSelector.onchange = (e) => {
            currentLang = e.target.value;
            localStorage.setItem("wissam_lang", currentLang);
            document.documentElement.setAttribute("lang", currentLang);
            document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
            render();
            loadSettings();
        };
    }
}

function toggleWishlist(productId) {
    const id = Number(productId);
    const index = wishlist.indexOf(id);
    if (index > -1) {
        wishlist.splice(index, 1);
    } else {
        wishlist.push(id);
    }
    localStorage.setItem("wissam_wishlist", JSON.stringify(wishlist));
    render();
}

function getFinalPrice(size){
    const price = Number(size?.price || 0);
    if(!size?.discount_enabled) return price;
    const discount = Number(size.discount_value || 0);
    if(size.discount_type === "percent"){
        return Math.max(0, price - (price * discount / 100));
    }
    return Math.max(0, price - discount);
}

function getDiscount(size){
    const price = Number(size?.price || 0);
    const final = getFinalPrice(size);
    return Math.max(0, price - final);
}

async function loadSettings(){
    try{
        const response = await fetch(`${API_CONFIG.url}/rest/v1/settings?select=*&limit=1`, { headers });
        if(!response.ok) throw new Error(await response.text());
        const data = await response.json();
        if(!data.length) return;
        storeSettings = data[0];
        document.querySelectorAll(".store-name").forEach(el => el.textContent = storeSettings.store_name || "الوسام للعطور");
        document.querySelectorAll(".tagline").forEach(el => el.textContent = storeSettings.tagline || "أناقة تدوم... وعطر يميزك");
    }catch(error){
        console.error("Settings:", error);
    }
}

async function loadProductDetails(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const area = document.getElementById("productViewArea");

    if(!id || !/^\d+$/.test(id)){
        area.innerHTML = `<div class="empty">❌ رقم أو معرف المنتج غير صحيح.<br><br><a href="index.html" class="back-btn">العودة للمتجر</a></div>`;
        return;
    }

    try{
        const response = await fetch(`${API_CONFIG.url}/rest/v1/products?id=eq.${id}&active=eq.true&select=*,product_sizes(*)`, { headers });
        if(!response.ok) throw new Error(await response.text());
        const data = await response.json();

        if(!data.length){
            area.innerHTML = `<div class="empty">❌ عذراً، هذا المنتج غير متوفر حالياً.<br><br><a href="index.html" class="back-btn">العودة للمتجر</a></div>`;
            return;
        }

        product = data[0];
        product.sizes = (product.product_sizes || []).sort((a,b) => Number(a.size_ml) - Number(b.size_ml));
        currentSize = product.sizes[0] || null;
        document.title = `${product.name} | الوسام للعطور`;
        render();
    }catch(error){
        area.innerHTML = `<div class="empty">❌ حدث خطأ أثناء تحميل المنتج.<br><br><small>${esc(error.message)}</small></div>`;
    }
}

function render(){
    const area = document.getElementById("productViewArea");
    if(!product) return;

    const t = translations[currentLang];
    const originalPrice = Number(currentSize?.price || 0);
    const finalPrice = getFinalPrice(currentSize);
    const discount = getDiscount(currentSize);
    const hasDiscount = discount > 0;
    const image = getProductImage(product.image);
    const isFav = wishlist.includes(Number(product.id));

    area.innerHTML = `
        <div class="product-layout">
            <div class="product-gallery">
                <img src="${esc(image)}" alt="${esc(product.name)}" onerror="this.onerror=null; this.src='assets/images/logo.jpg';">
                
                <button class="share-btn" onclick="copyLink()">
                    ${t.copyLink}
                </button>

                <button class="share-btn" onclick="toggleWishlist(${product.id})" style="border-color:${isFav ? '#ef4444' : 'var(--gold-main)'}; color:${isFav ? '#ef4444' : 'var(--gold-main)'};">
                    ${isFav ? '❤️ إزالة من المفضلة' : '🤍 إضافة للمفضلة'}
                </button>
            </div>

            <div class="product-info">
                <span class="cat-badge">${labels[product.category]?.[currentLang] || "فاخر"}</span>
                <h1>${esc(product.name)}</h1>

                <div class="stars-rating" style="color:#f59e0b; margin-bottom:10px; font-size:14px;">
                    ⭐⭐⭐⭐⭐ <span style="color:var(--text-dim); font-size:12px;">(4.9 / 5 - 128 Reviews)</span>
                </div>

                <div class="pricing-hero">
                    <strong>${money(finalPrice)}</strong>
                    ${hasDiscount ? `<del>${money(originalPrice)}</del><span class="discount-pill">وفرت ${money(discount)}</span>` : ""}
                </div>

                <div class="desc-text">
                    ${esc(product.description || "عطر فاخر ومميز يدوم طويلاً، مصمم خصيصاً ليناسب ذوقك الرفيع في جميع الأوقات والمناسبات الخاصة.")}
                </div>

                <h3>${t.chooseSize}</h3>
                <div class="sizes">
                    ${
                        product.sizes.length
                        ? product.sizes.map(size => {
                            const selected = Number(currentSize?.id) === Number(size.id);
                            const original = Number(size.price || 0);
                            const final = getFinalPrice(size);
                            const disc = getDiscount(size);

                            return `
                                <button class="${selected ? "sel" : ""}" onclick="pickSize(${Number(size.id)})">
                                    <b>${Number(size.size_ml)} ml</b>
                                    ${disc > 0 ? `<span class="size-old-price">${money(original)}</span><span class="size-final-price">${money(final)}</span>` : `<span class="size-final-price">${money(final)}</span>`}
                                </button>
                            `;
                        }).join("")
                        : `<p>لا توجد أحجام متاحة لهذا المنتج.</p>`
                    }
                </div>

                <h3 style="margin-top:20px;">${t.qtyText}</h3>
                <div class="qty">
                    <button onclick="qty = Math.max(1, qty - 1); render();">−</button>
                    <b>${qty}</b>
                    <button onclick="qty++; render();">+</button>
                </div>

                <div class="btn-actions-row">
                    <button class="btn-cart" onclick="addToCartAndPrompt()" ${!currentSize ? "disabled" : ""}>
                        ${t.addToCart}
                    </button>
                    ${currentSize ? `<a class="btn-whatsapp-direct" href="${buildWhatsAppOrderLink()}" target="_blank" rel="noopener">${t.buyWhatsapp}</a>` : ""}
                </div>
            </div>
        </div>
    `;
}

function pickSize(id){
    currentSize = product.sizes.find(size => Number(size.id) === Number(id));
    render();
}

function copyLink(){
    if(navigator.clipboard){
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("✅ تم نسخ رابط المنتج بنجاح!");
        });
    }
}

function normalizeWhatsApp(number){
    let value = String(number || "").replace(/\D/g,"");
    if(value.startsWith("0")) value = "20" + value.substring(1);
    return value;
}

function buildWhatsAppOrderLink(){
    const number = normalizeWhatsApp(storeSettings?.whatsapp);
    if(!number) return "#";
    const finalPrice = getFinalPrice(currentSize);
    const total = finalPrice * qty;
    const message = `🛍️ طلب عطر من الوسام للعطور\n\n🧴 المنتج: ${product.name}\n📏 الحجم: ${currentSize.size_ml} ml\n🔢 الكمية: ${qty}\n💰 السعر: ${money(finalPrice)}\n📦 الإجمالي: ${money(total)}\n\nأرغب في تأكيد هذا الطلب.`;
    return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
}

function addToCartAndPrompt(){
    if(!currentSize){
        alert("من فضلك اختر الحجم أولاً");
        return;
    }

    let cart = JSON.parse(localStorage.getItem("wissam_cart") || "[]");
    const existing = cart.find(item => Number(item.product.id) === Number(product.id) && Number(item.size.id) === Number(currentSize.id));

    if(existing){
        existing.qty += qty;
    }else{
        cart.push({
            product: { id: product.id, name: product.name, image: product.image },
            size: currentSize,
            qty: qty
        });
    }

    localStorage.setItem("wissam_cart", JSON.stringify(cart));
    showAddedConfirmationModal();
}

function showAddedConfirmationModal(){
    let cart = JSON.parse(localStorage.getItem("wissam_cart") || "[]");
    let totalQty = cart.reduce((sum, item) => sum + Number(item.qty), 0);
    let subtotal = cart.reduce((sum, item) => sum + getFinalPrice(item.size) * Number(item.qty), 0);

    let earnedFreeGifts = 0;
    if(storeSettings?.offer_enabled){
        const buyStep = Number(storeSettings.offer_buy_qty || 2);
        const freeStep = Number(storeSettings.offer_free_qty || 1);
        earnedFreeGifts = Math.floor(totalQty / buyStep) * freeStep;
    }

    let modalEl = document.getElementById("productModal");
    if(!modalEl){
        modalEl = document.createElement("div");
        modalEl.id = "productModal";
        modalEl.className = "modal show";
        modalEl.innerHTML = `
          <div class="box">
            <button class="x" onclick="closeProductModal()">×</button>
            <div id="modalBoxContent"></div>
          </div>
        `;
        document.body.appendChild(modalEl);
    }else{
        modalEl.classList.add("show");
    }

    document.getElementById("modalBoxContent").innerHTML = `
        <div style="text-align:center; padding: 20px 10px;">
            <div style="font-size:45px; margin-bottom:8px;">🎉</div>
            <h2 style="color:var(--gold-main); margin:0 0 8px;">تمت إضافة العطر إلى السلة!</h2>
            <p style="color:var(--text-muted); font-size:15px; margin:0 0 14px;">
                <b>${product.name}</b> (${currentSize.size_ml} ml) × ${qty}
            </p>

            ${earnedFreeGifts > 0 ? `
                <div style="background:rgba(34,197,94,0.12);border:1px solid #22c55e;padding:10px;border-radius:8px;color:#4ade80;font-size:13px;font-weight:bold;margin-bottom:15px;">
                    🎁 مبروك! طلبك أصبح مؤهلاً للحصول على (${earnedFreeGifts}) قطعة هدية مجاناً!
                </div>
            ` : ""}

            <div style="background:var(--bg-surface-elevated); padding:12px; border-radius:10px; border:1px solid var(--border-color); margin-bottom:18px; font-size:14px;">
                عدد القطع بالسلة: <b>${totalQty}</b> | الإجمالي: <b style="color:var(--gold-main);">${money(subtotal)}</b>
            </div>

            <div class="added-actions" style="display:flex; gap:12px; margin-top:18px;">
                <button onclick="closeProductModal()" style="flex:1; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; background:var(--bg-surface-elevated); color:var(--text-main); border:1px solid var(--border-color);">
                    🛍️ إكمال التسوق
                </button>
                <button onclick="goToStoreCart()" style="flex:1; padding:12px; border-radius:10px; font-weight:700; cursor:pointer; background:var(--gold-gradient); color:#080808; border:none;">
                    💳 إتمام الشراء (فتح السلة)
                </button>
            </div>
        </div>
    `;
}

function closeProductModal(){
    const modalEl = document.getElementById("productModal");
    if(modalEl) modalEl.classList.remove("show");
}

function goToStoreCart(){
    window.location.href = "index.html#openCart";
}

initTheme();
initLanguage();
loadSettings();
loadProductDetails();
</script>
</body>
</html>
