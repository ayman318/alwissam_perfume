<style>
.product-page-container{
    max-width:1050px;
    margin:35px auto 60px;
    padding:0 20px;
}

.back-nav{
    margin-bottom:22px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold-main);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    background:var(--bg-surface);
    padding:10px 20px;
    border-radius:22px;
    border:1px solid var(--border-color);
    transition:all .25s ease;
}

.back-btn:hover{
    border-color:var(--gold-main);
    transform:translateX(4px);
}

.product-layout{
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:40px;
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    border-radius:22px;
    padding:35px;
    box-shadow:var(--shadow-card);
}

.product-gallery{
    position:relative;
    text-align:center;
}

.product-gallery img{
    width:100%;
    max-height:460px;
    object-fit:cover;
    border-radius:16px;
    border:1px solid var(--border-color);
    background:var(--bg-surface-elevated);
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

.product-info h1{
    margin:10px 0 14px;
    font-size:28px;
    line-height:1.3;
}

.cat-badge{
    display:inline-block;
    color:var(--gold-main);
    background:rgba(214,179,75,.12);
    border:1px solid var(--border-gold);
    padding:5px 14px;
    border-radius:16px;
    font-size:13px;
    font-weight:700;
}

.pricing-hero{
    margin:18px 0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
}

.pricing-hero strong{
    font-size:32px;
    color:var(--gold-main);
}

.pricing-hero del{
    color:var(--text-dim);
    font-size:17px;
}

.discount-pill{
    background:#dc2626;
    color:#fff;
    font-weight:800;
    font-size:12px;
    padding:5px 12px;
    border-radius:8px;
}

.desc-text{
    color:var(--text-muted);
    line-height:1.85;
    font-size:15px;
    margin-bottom:25px;
    border-top:1px solid var(--border-color);
    border-bottom:1px solid var(--border-color);
    padding:16px 0;
}

.sizes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.sizes button{
    background:var(--bg-surface-elevated);
    color:var(--text-main);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:12px 8px;
    cursor:pointer;
    font-family:inherit;
    min-height:68px;
    transition:all .2s ease;
}

.sizes button:hover{
    border-color:var(--border-gold);
}

.sizes button.sel{
    border-color:var(--gold-main);
    background:rgba(214,179,75,.14);
    box-shadow:0 0 10px rgba(214,179,75,.18);
}

.size-old-price{
    display:block;
    color:var(--text-dim);
    text-decoration:line-through;
    font-size:12px;
    margin-top:4px;
}

.size-final-price{
    display:block;
    color:var(--gold-main);
    font-weight:900;
    margin-top:3px;
}

.qty{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:12px;
}

.qty button{
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--border-color);
    background:var(--bg-surface-elevated);
    color:var(--text-main);
    font-size:20px;
    cursor:pointer;
    transition:background .2s;
}

.qty button:hover{
    border-color:var(--gold-main);
    color:var(--gold-main);
}

.qty b{
    font-size:20px;
}

.btn-actions-row{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn-actions-row button,
.btn-actions-row a{
    flex:1;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    border:none;
    font-family:inherit;
    text-decoration:none;
    transition:transform .2s ease, opacity .2s ease;
}

.btn-actions-row button:hover,
.btn-actions-row a:hover{
    transform:translateY(-2px);
    opacity:.95;
}

.btn-cart{
    background:var(--gold-gradient);
    color:#080808;
}

.btn-cart:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.btn-whatsapp-direct{
    background:#25d366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.share-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    border-radius:12px;
    background:var(--bg-surface-elevated);
    color:var(--gold-main);
    border:1px dashed var(--gold-main);
    cursor:pointer;
    font-family:inherit;
    font-weight:700;
    transition:background .2s;
}

.share-btn:hover{
    background:rgba(214,179,75,.1);
}

.loading{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
    font-size:16px;
}

/* نافذة تأكيد الإضافة */

#productModal{
    position:fixed;
    inset:0;
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);

}

#productModal.show{
    display:flex;
}

#productModal .box{
    position:relative;
    width:min(500px,100%);

    background:var(--bg-surface);

    border:1px solid var(--border-color);

}

@media(max-width:820px){

    .product-layout{
        grid-template-columns:1fr;
        gap:25px;
        padding:20px;
    }

    .product-gallery img{
        max-height:330px;
    }

    .sizes{
        grid-template-columns:repeat(2,1fr);
    }

    .btn-actions-row{
        flex-direction:column;
    }

    .product-info h1{
        font-size:24px;
    }
}

<script>

/* ==========================================
   API
========================================== */

const API_CONFIG = {

    url:
        "https://dbtvicvsabdypxjhafxt.supabase.co",

    anonKey:
        "sb_publishable_cE_nDKgQJMBczIgGph0WbA_ekFMWxlq"

};

const headers = {

    apikey:
        API_CONFIG.anonKey,

    Authorization:
        `Bearer ${API_CONFIG.anonKey}`

};


/* ==========================================
   CONSTANTS
========================================== */

const labels = {

    men:"رجال",

    women:"نساء",

    unisex:"للجنسين",

    original:"أورجينال"

};


const money = n =>

    Number(n || 0).toLocaleString(
        "ar-EG",
        {
            maximumFractionDigits:2
        }
    )
    + " جنيه";


let product = null;

let currentSize = null;

let qty = 1;

let storeSettings = null;


/* ==========================================
   ESC
========================================== */

function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,char => ({

            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

        }[char]));

}


/* ==========================================
   IMAGE
========================================== */

function getProductImage(image){

    if(!image)
        return "assets/images/logo.jpg";

    let value =
        String(image).trim();

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){

        return value;

    }

    value =
        value.replace(/^\/+/,"");

    if(value.includes("storage/v1/object")){

        return value.startsWith("/")
            ? API_CONFIG.url + value
            : value;

    }

    return `${API_CONFIG.url}/storage/v1/object/public/product-images/${encodeURIComponent(value)}`;

}


/* ==========================================
   THEME
========================================== */

function initTheme(){

    const saved =
        localStorage.getItem("wissam_theme")
        || "dark";

    document.documentElement
        .setAttribute("data-theme",saved);

    const icon =
        document.querySelector(".theme-icon");

    if(icon){

        icon.textContent =
            saved === "dark"
            ? "☀️"
            : "🌙";

    }

    const button =
        document.getElementById("themeToggle");

    if(button){

        button.onclick = () => {

            const current =
                document.documentElement
                .getAttribute("data-theme")
                || "dark";

            const next =
                current === "dark"
                ? "light"
                : "dark";

            document.documentElement
                .setAttribute("data-theme",next);

            localStorage.setItem(
                "wissam_theme",
                next
            );

            if(icon){

                icon.textContent =
                    next === "dark"
                    ? "☀️"
                    : "🌙";

            }

        };

    }

}


/* ==========================================
   PRICE
========================================== */

function getFinalPrice(size){

    const price =
        Number(size?.price || 0);

    if(!size?.discount_enabled)
        return price;

    const discount =
        Number(size?.discount_value || 0);

    if(size.discount_type === "percent"){

        return Math.max(
            0,
            price -
            (price * discount / 100)
        );

    }

    return Math.max(
        0,
        price - discount
    );

}


function getDiscount(size){

    const price =
        Number(size?.price || 0);

    const final =
        getFinalPrice(size);

    return Math.max(
        0,
        price - final
    );

}


/* ==========================================
   SETTINGS
========================================== */

async function loadSettings(){

    try{

        const response =
            await fetch(
                `${API_CONFIG.url}/rest/v1/settings?select=*&limit=1`,
                {headers}
            );

        if(!response.ok)
            throw new Error(
                await response.text()
            );

        const data =
            await response.json();

        if(!data.length)
            return;

        storeSettings =
            data[0];

        document
            .querySelectorAll(".store-name")
            .forEach(el => {

                el.textContent =
                    storeSettings.store_name
                    || "الوسام للعطور";

            });

        document
            .querySelectorAll(".tagline")
            .forEach(el => {

                el.textContent =
                    storeSettings.tagline
                    || "أناقة تدوم... وعطر يميزك";

            });

    }catch(error){

        console.error(
            "Settings error:",
            error
        );

    }

}


/* ==========================================
   LOAD PRODUCT
========================================== */

async function loadProductDetails(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");

    const area =
        document.getElementById(
            "productViewArea"
        );

    if(
        !id ||
        !/^\d+$/.test(id)
    ){

        area.innerHTML = `

            <div class="empty">

                ❌ رقم المنتج غير صحيح.

                <br><br>

                <a
                    href="index.html"
                    class="back-btn"
                >
                    العودة للمتجر
                </a>

            </div>

        `;

        return;

    }


    try{

        const response =
            await fetch(

                `${API_CONFIG.url}/rest/v1/products?id=eq.${id}&active=eq.true&select=*,product_sizes(*)`,

                {headers}

            );

        if(!response.ok)
            throw new Error(
                await response.text()
            );


        const data =
            await response.json();


        if(!data.length){

            area.innerHTML = `

                <div class="empty">

                    ❌ عذراً، هذا المنتج غير متوفر حالياً.

                    <br><br>

                    <a
                        href="index.html"
                        class="back-btn"
                    >
                        العودة للمتجر
                    </a>

                </div>

            `;

            return;

        }


        product =
            data[0];


        product.sizes =
            (product.product_sizes || [])
            .sort(
                (a,b) =>
                    Number(a.size_ml) -
                    Number(b.size_ml)
            );


        currentSize =
            product.sizes[0] || null;


        document.title =
            `${product.name} | الوسام للعطور`;


        render();


    }catch(error){

        console.error(error);

        area.innerHTML = `

            <div class="empty">

                ❌ حدث خطأ أثناء تحميل المنتج.

                <br><br>

                <small>
                    ${esc(error.message)}
                </small>

            </div>

        `;

    }

}


/* ==========================================
   RENDER
========================================== */

function render(){

    const area =
        document.getElementById(
            "productViewArea"
        );

    if(!product)
        return;


    const originalPrice =
        Number(
            currentSize?.price || 0
        );


    const finalPrice =
        getFinalPrice(
            currentSize
        );


    const discount =
        getDiscount(
            currentSize
        );


    const hasDiscount =
        discount > 0;


    const image =
        getProductImage(
            product.image
        );


    area.innerHTML = `

        <div class="product-layout">

            <div class="product-gallery">

                <img
                    src="${esc(image)}"
                    alt="${esc(product.name)}"
                    onerror="
                        this.onerror=null;
                        this.src='assets/images/logo.jpg';
                    "
                >

                <button
                    class="share-btn"
                    onclick="copyLink()"
                >
                    🔗 نسخ رابط العطر للمشاركة
                </button>

            </div>


            <div class="product-info">

                <span class="cat-badge">

                    ${labels[product.category] || "فاخر"}

                </span>


                <h1>
                    ${esc(product.name)}
                </h1>


                <div class="pricing-hero">

                    <strong>
                        ${money(finalPrice)}
                    </strong>

                    ${
                        hasDiscount
                        ?
                        `
                        <del>
                            ${money(originalPrice)}
                        </del>

                        <span class="discount-pill">
                            وفرت ${money(discount)}
                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <div class="desc-text">

                    ${
                        esc(
                            product.description ||
                            "عطر فاخر ومميز يدوم طويلاً، مصمم خصيصاً ليناسب ذوقك الرفيع في جميع الأوقات والمناسبات."
                        )
                    }

                </div>


                <h3>
                    اختر الحجم:
                </h3>


                <div class="sizes">

                    ${
                        product.sizes.length

                        ?

                        product.sizes
                        .map(size => {

                            const selected =
                                Number(
                                    currentSize?.id
                                ) ===
                                Number(size.id);

                            const original =
                                Number(
                                    size.price || 0
                                );

                            const final =
                                getFinalPrice(
                                    size
                                );

                            const disc =
                                getDiscount(
                                    size
                                );


                            return `

                                <button
                                    class="${selected ? "sel" : ""}"
                                    onclick="pickSize(${Number(size.id)})"
                                >

                                    <b>
                                        ${Number(size.size_ml)} ml
                                    </b>

                                    ${
                                        disc > 0

                                        ?

                                        `
                                        <span class="size-old-price">
                                            ${money(original)}
                                        </span>

                                        <span class="size-final-price">
                                            ${money(final)}
                                        </span>
                                        `

                                        :

                                        `
                                        <span class="size-final-price">
                                            ${money(final)}
                                        </span>
                                        `
                                    }

                                </button>

                            `;

                        }).join("")

                        :

                        `
                        <p>
                            لا توجد أحجام متاحة لهذا المنتج.
                        </p>
                        `
                    }

                </div>


                <h3 style="margin-top:20px;">
                    الكمية:
                </h3>


                <div class="qty">

                    <button
                        onclick="
                            qty=Math.max(1,qty-1);
                            render();
                        "
                    >
                        −
                    </button>


                    <b>
                        ${qty}
                    </b>


                    <button
                        onclick="
                            qty++;
                            render();
                        "
                    >
                        +
                    </button>

                </div>


                <div class="btn-actions-row">

                    <button
                        class="btn-cart"
                        onclick="addToCartAndPrompt()"
                        ${!currentSize ? "disabled" : ""}
                    >
                        🛒 إضافة للسلة
                    </button>


                    ${
                        currentSize

                        ?

                        `
                        <a
                            class="btn-whatsapp-direct"
                            href="${buildWhatsAppOrderLink()}"
                            target="_blank"
                            rel="noopener"
                        >
                            💬 طلب فوري عبر WhatsApp
                        </a>
                        `

                        :

                        ""
                    }

                </div>

            </div>

        </div>

    `;

}


/* ==========================================
   PICK SIZE
========================================== */

function pickSize(id){

    if(!product)
        return;

    currentSize =
        product.sizes.find(
            size =>
                Number(size.id) ===
                Number(id)
        );

    render();

}


/* ==========================================
   COPY LINK
========================================== */

function copyLink(){

    if(!navigator.clipboard){

        alert(
            "❌ المتصفح لا يدعم نسخ الرابط تلقائياً"
        );

        return;

    }

    navigator.clipboard
        .writeText(
            window.location.href
        )
        .then(() => {

            alert(
                "✅ تم نسخ رابط المنتج بنجاح!"
            );

        })
        .catch(() => {

            alert(
                "❌ لم يتم نسخ الرابط"
            );

        });

}


/* ==========================================
   WHATSAPP
========================================== */

function normalizeWhatsApp(number){

    let value =
        String(number || "")
        .replace(/\D/g,"");

    if(value.startsWith("0")){

        value =
            "20" +
            value.substring(1);

    }

    return value;

}


function buildWhatsAppOrderLink(){

    const number =
        normalizeWhatsApp(
            storeSettings?.whatsapp
        );

    if(!number)
        return "#";


    const finalPrice =
        getFinalPrice(
            currentSize
        );


    const total =
        finalPrice * qty;


    const message =
        `🛍️ طلب عطر من الوسام للعطور

🧴 المنتج: ${product.name}
📏 الحجم: ${currentSize.size_ml} ml
🔢 الكمية: ${qty}
💰 السعر: ${money(finalPrice)}
📦 الإجمالي: ${money(total)}

أرغب في تأكيد هذا الطلب.`;


    return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

}


/* ==========================================
   ADD TO CART
========================================== */

function addToCartAndPrompt(){

    if(!product){

        alert(
            "❌ بيانات المنتج غير مكتملة"
        );

        return;

    }


    if(!currentSize){

        alert(
            "⚠️ من فضلك اختر الحجم أولاً"
        );

        return;

    }


    qty =
        Math.max(
            1,
            Number(qty) || 1
        );


    let cart = [];


    /* قراءة السلة */

    try{

        const saved =
            localStorage.getItem(
                "wissam_cart"
            );

        cart =
            saved
            ? JSON.parse(saved)
            : [];


        if(!Array.isArray(cart)){

            cart = [];

        }

    }catch(error){

        console.error(
            "Cart read error:",
            error
        );

        cart = [];

    }


    /* البحث عن المنتج والحجم */

    const existingIndex =
        cart.findIndex(item =>

            Number(
                item?.product?.id
            ) ===
            Number(product.id)

            &&

            Number(
                item?.size?.id
            ) ===
            Number(currentSize.id)

        );


    /* المنتج موجود */

    if(existingIndex !== -1){

        cart[existingIndex].qty =

            Number(
                cart[existingIndex].qty || 0
            )

            +

            qty;

    }

    /* منتج جديد */

    else{

        cart.push({

            product:{

                id:
                    product.id,

                name:
                    product.name,

                image:
                    product.image || ""

            },

            size:{

                id:
                    currentSize.id,

                size_ml:
                    currentSize.size_ml,

                price:
                    currentSize.price,

                discount_enabled:
                    currentSize.discount_enabled,

                discount_type:
                    currentSize.discount_type,

                discount_value:
                    currentSize.discount_value

            },

            qty:
                qty

        });

    }


    /* حفظ السلة */

    try{

        localStorage.setItem(
            "wissam_cart",
            JSON.stringify(cart)
        );


        /* التأكد من الحفظ */

        const check =
            JSON.parse(
                localStorage.getItem(
                    "wissam_cart"
                ) || "[]"
            );


        if(!Array.isArray(check)){

            throw new Error(
                "فشل حفظ السلة"
            );

        }

    }catch(error){

        console.error(
            "Cart save error:",
            error
        );

        alert(
            "❌ حدثت مشكلة أثناء حفظ السلة"
        );

        return;

    }


    /* فتح رسالة التأكيد */

    showAddedConfirmationModal(
        cart
    );

}


/* ==========================================
   CONFIRMATION MODAL
========================================== */

function showAddedConfirmationModal(cart){

    const totalQty =
        cart.reduce(
            (sum,item) =>
                sum +
                Number(item?.qty || 0),
            0
        );


    const subtotal =
        cart.reduce(
            (sum,item) =>

                sum +

                getFinalPrice(
                    item.size
                ) *

                Number(
                    item?.qty || 0
                ),

            0
        );


    let earnedFreeGifts = 0;


    if(
        storeSettings?.offer_enabled
    ){

        const buyStep =
            Number(
                storeSettings.offer_buy_qty || 2
            );


        const freeStep =
            Number(
                storeSettings.offer_free_qty || 1
            );


        if(buyStep > 0){

            earnedFreeGifts =
                Math.floor(
                    totalQty /
                    buyStep
                ) *
                freeStep;

        }

    }


    let modalEl =
        document.getElementById(
            "productModal"
        );


    if(!modalEl){

        modalEl =
            document.createElement(
                "div"
            );


        modalEl.id =
            "productModal";


        modalEl.className =
            "modal";


        modalEl.innerHTML = `

            <div class="box">

                <button
                    class="x"
                    onclick="closeProductModal()"
                    style="
                        position:absolute;
                        left:14px;
                        top:8px;
                        background:none;
                        border:0;
                        color:var(--text-muted);
                        font-size:30px;
                        cursor:pointer;
                    "
                >
                    ×
                </button>


                <div id="modalBoxContent"></div>

            </div>

        `;


        document.body.appendChild(
            modalEl
        );

    }


    modalEl.classList.add(
        "show"
    );


    document.getElementById(
        "modalBoxContent"
    ).innerHTML = `

        <div style="
            text-align:center;
            padding:20px 10px;
        ">

            <div style="
                font-size:45px;
                margin-bottom:8px;
            ">
                🎉
            </div>


            <h2 style="
                color:var(--gold-main);
                margin:0 0 8px;
            ">
                تمت إضافة العطر إلى السلة!
            </h2>


            <p style="
                color:var(--text-muted);
                font-size:15px;
                margin:0 0 14px;
            ">

                <b>
                    ${esc(product.name)}
                </b>

                (${Number(currentSize.size_ml)} ml)

                × ${qty}

            </p>


            ${
                earnedFreeGifts > 0

                ?

                `
                <div style="
                    background:rgba(34,197,94,0.12);
                    border:1px solid #22c55e;
                    padding:10px;
                    border-radius:8px;
                    color:#4ade80;
                    font-size:13px;
                    font-weight:bold;
                    margin-bottom:15px;
                ">

                    🎁 مبروك!
                    أصبحت مؤهلاً للحصول على
                    (${earnedFreeGifts})
                    قطعة هدية مجاناً!

                </div>
                `

                :

                ""
            }


            <div style="
                background:var(--bg-surface-elevated);
                padding:12px;
                border-radius:10px;
                border:1px solid var(--border-color);
                margin-bottom:18px;
                font-size:14px;
            ">

                عدد القطع بالسلة:

                <b>
                    ${totalQty}
                </b>

                |

                الإجمالي:

                <b style="
                    color:var(--gold-main);
                ">
                    ${money(subtotal)}
                </b>

            </div>


            <div
                class="added-actions"
                style="
                    display:flex;
                    gap:12px;
                    margin-top:18px;
                "
            >

                <button
                    onclick="continueShopping()"
                    style="
                        flex:1;
                        padding:12px;
                        border-radius:10px;
                        font-weight:700;
                        cursor:pointer;
                        background:var(--bg-surface-elevated);
                        color:var(--text-main);
                        border:1px solid var(--border-color);
                    "
                >
                    🛍️ إكمال التسوق
                </button>


                <button
                    onclick="goToStoreCart()"
                    style="
                        flex:1;
                        padding:12px;
                        border-radius:10px;
                        font-weight:700;
                        cursor:pointer;
                        background:var(--gold-gradient);
                        color:#080808;
                        border:none;
                    "
                >
                    💳 إتمام الشراء
                </button>

            </div>

        </div>

    `;

}


/* ==========================================
   CONTINUE SHOPPING
========================================== */

function continueShopping(){

    /*
       مهم جداً:
       السلة تم حفظها بالفعل في localStorage
       قبل الوصول لهذه الوظيفة.
    */

    closeProductModal();


    setTimeout(() => {

        window.location.href =
            "index.html";

    },100);

}


/* ==========================================
   CLOSE MODAL
========================================== */

function closeProductModal(){

    const modalEl =
        document.getElementById(
            "productModal"
        );

    if(modalEl){

        modalEl.classList.remove(
            "show"
        );

    }

}


/* ==========================================
   GO TO CART
========================================== */

function goToStoreCart(){

    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "wissam_cart"
                ) || "[]"
            );

    }catch(error){

        cart = [];

    }


    if(
        !Array.isArray(cart) ||
        !cart.length
    ){

        alert(
            "❌ السلة فارغة"
        );

        return;

    }


    /*
       الانتقال للمتجر وفتح السلة
    */

    window.location.href =
        "index.html#openCart";

}


/* ==========================================
   START
========================================== */

initTheme();

loadSettings();

loadProductDetails();

</script>
