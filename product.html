<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تفاصيل العطر | الوسام للعطور</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>
.product-page-container{
    max-width:1050px;
    margin:30px auto 60px;
    padding:0 20px;
}

.back-nav{
    margin-bottom:20px;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--gold-main);
    text-decoration:none;
    font-weight:700;
    font-size:14px;
    background:var(--bg-surface);
    padding:9px 18px;
    border-radius:20px;
    border:1px solid var(--border-color);
}

.product-layout{
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:40px;
    background:var(--bg-surface);
    border:1px solid var(--border-color);
    border-radius:20px;
    padding:35px;
    box-shadow:var(--shadow-card);
}

.product-gallery{
    position:relative;
    text-align:center;
}

.product-gallery img{
    width:100%;
    max-height:480px;
    object-fit:contain;
    border-radius:16px;
    border:1px solid var(--border-color);
    background:#111;
}

.product-info h1{
    margin:8px 0 12px;
    font-size:28px;
}

.cat-badge{
    display:inline-block;
    color:var(--gold-main);
    background:rgba(214,179,75,.12);
    border:1px solid var(--border-gold);
    padding:5px 12px;
    border-radius:14px;
    font-size:13px;
    font-weight:700;
}

.pricing-hero{
    margin:18px 0;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.pricing-hero strong{
    font-size:30px;
    color:var(--gold-main);
}

.pricing-hero del{
    color:var(--text-dim);
    font-size:17px;
}

.discount-pill{
    background:#dc2626;
    color:#fff;
    font-weight:800;
    font-size:12px;
    padding:5px 10px;
    border-radius:8px;
}

.desc-text{
    color:var(--text-muted);
    line-height:1.8;
    font-size:15px;
    margin-bottom:25px;
    border-top:1px solid var(--border-color);
    border-bottom:1px solid var(--border-color);
    padding:15px 0;
}

.sizes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.sizes button{
    background:var(--bg-surface);
    color:var(--text-main);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:13px 8px;
    cursor:pointer;
    font-family:inherit;
    min-height:70px;
}

.sizes button.sel{
    border-color:var(--gold-main);
    background:rgba(214,179,75,.12);
}

.size-old-price{
    display:block;
    color:var(--text-dim);
    text-decoration:line-through;
    font-size:12px;
    margin-top:4px;
}

.size-final-price{
    display:block;
    color:var(--gold-main);
    font-weight:900;
    margin-top:3px;
}

.qty{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:12px;
}

.qty button{
    width:42px;
    height:42px;
    border-radius:10px;
    border:1px solid var(--border-color);
    background:var(--bg-surface);
    color:var(--text-main);
    font-size:22px;
    cursor:pointer;
}

.qty b{
    font-size:20px;
}

.btn-actions-row{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.btn-actions-row button,
.btn-actions-row a{
    flex:1;
    text-align:center;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    font-size:15px;
    cursor:pointer;
    border:none;
    font-family:inherit;
    text-decoration:none;
}

.btn-cart{
    background:var(--gold-gradient);
    color:#080808;
}

.btn-whatsapp-direct{
    background:#25d366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.share-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    border-radius:12px;
    background:var(--bg-surface);
    color:var(--gold-main);
    border:1px solid var(--border-color);
    cursor:pointer;
    font-family:inherit;
}

.loading{
    text-align:center;
    padding:50px 20px;
}

@media(max-width:820px){

    .product-layout{
        grid-template-columns:1fr;
        gap:25px;
        padding:20px;
    }

    .product-gallery img{
        max-height:330px;
    }

    .sizes{
        grid-template-columns:repeat(2,1fr);
    }

    .btn-actions-row{
        flex-direction:column;
    }

    .product-info h1{
        font-size:24px;
    }
}

@media(max-width:420px){

    .sizes{
        grid-template-columns:1fr 1fr;
    }
}
</style>
</head>

<body>

<header>

<a class="brand" href="index.html">

<img src="assets/images/logo.jpg" alt="الوسام">

<span>
<b class="store-name">الوسام للعطور</b>
<small class="tagline">أناقة تدوم... وعطر يميزك</small>
</span>

</a>

<div class="header-actions">

<button id="themeToggle" class="theme-btn">
<span class="theme-icon">☀️</span>
</button>

<a href="index.html" class="icon-action-btn">
🏠 المتجر
</a>

</div>

</header>


<div class="product-page-container">

<div class="back-nav">

<a href="index.html" class="back-btn">
← العودة للمتجر
</a>

</div>


<div id="productViewArea">

<div class="loading">
🧴 جاري تحميل تفاصيل العطر...
</div>

</div>

</div>


<footer>

© 2026
<span class="store-name">الوسام للعطور</span>
—
جميع الحقوق محفوظة
|
برمجة وتطوير

<a
href="https://wa.me/201280815067"
target="_blank"
rel="noopener noreferrer"
>
✦ Ayman Abdelsanad ✦
</a>

</footer>


<script>

const API_CONFIG = {

    url:
    "https://dbtvicvsabdypxjhafxt.supabase.co",

    anonKey:
    "sb_publishable_cE_nDKgQJMBczIgGph0WbA_ekFMWxlq"

};


const headers = {

    apikey:
    API_CONFIG.anonKey,

    Authorization:
    `Bearer ${API_CONFIG.anonKey}`

};


const labels = {

    men:"رجال",

    women:"نساء",

    unisex:"للجنسين",

    original:"أورجينال"

};


const money = n =>

Number(n || 0).toLocaleString(
    "ar-EG",
    {
        maximumFractionDigits:2
    }
) + " جنيه";


let product = null;

let currentSize = null;

let qty = 1;

let storeSettings = null;


/* =========================
   ESCAPE
========================= */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g, char => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

    }[char]));

}


/* =========================
   IMAGE
========================= */

function getProductImage(image){

    if(!image){

        return "assets/images/logo.jpg";

    }

    let value =
    String(image).trim();


    /*
       لو الصورة رابط كامل
    */

    if(
        value.startsWith("https://") ||
        value.startsWith("http://")
    ){

        return value;

    }


    /*
       لو الصورة محفوظة كمسار
    */

    value =
    value.replace(/^\/+/,"");


    /*
       لو القيمة بالفعل مسار Storage
    */

    if(
        value.includes("storage/v1/object")
    ){

        return value.startsWith("/")
        ? API_CONFIG.url + value
        : value;

    }


    /*
       لو مجرد اسم الصورة
    */

    return `${API_CONFIG.url}/storage/v1/object/public/product-images/${encodeURIComponent(value)}`;

}


/* =========================
   THEME
========================= */

function initTheme(){

    const saved =
    localStorage.getItem("wissam_theme")
    || "dark";


    document.documentElement
    .setAttribute(
        "data-theme",
        saved
    );


    const icon =
    document.querySelector(".theme-icon");


    if(icon){

        icon.textContent =
        saved === "dark"
        ? "☀️"
        : "🌙";

    }


    const button =
    document.getElementById("themeToggle");


    if(button){

        button.onclick = () => {

            const current =
            document.documentElement
            .getAttribute("data-theme")
            || "dark";


            const next =
            current === "dark"
            ? "light"
            : "dark";


            document.documentElement
            .setAttribute(
                "data-theme",
                next
            );


            localStorage.setItem(
                "wissam_theme",
                next
            );


            if(icon){

                icon.textContent =
                next === "dark"
                ? "☀️"
                : "🌙";

            }

        };

    }

}


/* =========================
   PRICE
========================= */

function getFinalPrice(size){

    const price =
    Number(size?.price || 0);


    if(!size?.discount_enabled){

        return price;

    }


    const discount =
    Number(size.discount_value || 0);


    if(
        size.discount_type ===
        "percent"
    ){

        return Math.max(
            0,
            price -
            (price * discount / 100)
        );

    }


    return Math.max(
        0,
        price - discount
    );

}


function getDiscount(size){

    const price =
    Number(size?.price || 0);


    const final =
    getFinalPrice(size);


    return Math.max(
        0,
        price - final
    );

}


/* =========================
   SETTINGS
========================= */

async function loadSettings(){

    try{

        const response =
        await fetch(
            `${API_CONFIG.url}/rest/v1/settings?select=*&limit=1`,
            {
                headers
            }
        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
        await response.json();


        if(!data.length){

            return;

        }


        storeSettings =
        data[0];


        document
        .querySelectorAll(".store-name")
        .forEach(element => {

            element.textContent =
            storeSettings.store_name
            ||
            "الوسام للعطور";

        });


        document
        .querySelectorAll(".tagline")
        .forEach(element => {

            element.textContent =
            storeSettings.tagline
            ||
            "أناقة تدوم... وعطر يميزك";

        });

    }
    catch(error){

        console.error(
            "Settings:",
            error
        );

    }

}


/* =========================
   LOAD PRODUCT
========================= */

async function loadProductDetails(){

    const params =
    new URLSearchParams(
        window.location.search
    );


    const id =
    params.get("id");


    const area =
    document.getElementById(
        "productViewArea"
    );


    if(!id){

        area.innerHTML = `

            <div class="empty">

                ❌ لم يتم تحديد المنتج.

                <br><br>

                <a href="index.html">
                    العودة للمتجر
                </a>

            </div>

        `;

        return;

    }


    /*
       نتأكد أن id رقم
    */

    if(!/^\d+$/.test(id)){

        area.innerHTML = `

            <div class="empty">

                ❌ رقم المنتج غير صحيح.

            </div>

        `;

        return;

    }


    try{

        const response =
        await fetch(
            `${API_CONFIG.url}/rest/v1/products?id=eq.${id}&active=eq.true&select=*,product_sizes(*)`,
            {
                headers
            }
        );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
        await response.json();


        if(!data.length){

            area.innerHTML = `

                <div class="empty">

                    ❌ هذا المنتج غير متوفر حالياً.

                    <br><br>

                    <a href="index.html">
                        العودة للمتجر
                    </a>

                </div>

            `;

            return;

        }


        product =
        data[0];


        product.sizes =
        (
            product.product_sizes
            || []
        ).sort(
            (a,b) =>
            Number(a.size_ml)
            -
            Number(b.size_ml)
        );


        currentSize =
        product.sizes[0]
        || null;


        document.title =
        `${product.name} | الوسام للعطور`;


        render();

    }
    catch(error){

        console.error(
            "Product:",
            error
        );


        area.innerHTML = `

            <div class="empty">

                ❌ حدث خطأ أثناء تحميل المنتج.

                <br><br>

                <small>
                    ${esc(error.message)}
                </small>

            </div>

        `;

    }

}


/* =========================
   RENDER
========================= */

function render(){

    const area =
    document.getElementById(
        "productViewArea"
    );


    if(!product){

        return;

    }


    const originalPrice =
    Number(
        currentSize?.price || 0
    );


    const finalPrice =
    getFinalPrice(
        currentSize
    );


    const discount =
    getDiscount(
        currentSize
    );


    const hasDiscount =
    discount > 0;


    const image =
    getProductImage(
        product.image
    );


    area.innerHTML = `

        <div class="product-layout">


            <div class="product-gallery">


                <img

                    src="${esc(image)}"

                    alt="${esc(product.name)}"

                    onerror="
                        this.onerror=null;
                        this.src='assets/images/logo.jpg';
                    "

                >


                <button
                    class="share-btn"
                    onclick="copyLink()"
                >

                    🔗 نسخ رابط العطر

                </button>


            </div>



            <div class="product-info">


                <span class="cat-badge">

                    ${labels[product.category] || "فاخر"}

                </span>


                <h1>

                    ${esc(product.name)}

                </h1>


                <div class="pricing-hero">

                    <strong>

                        ${money(finalPrice)}

                    </strong>


                    ${
                        hasDiscount
                        ?
                        `
                            <del>
                                ${money(originalPrice)}
                            </del>

                            <span class="discount-pill">
                                وفرت ${money(discount)}
                            </span>
                        `
                        :
                        ""
                    }

                </div>


                <div class="desc-text">

                    ${esc(
                        product.description
                        ||
                        "عطر فاخر ومميز مناسب لجميع الأوقات والمناسبات."
                    )}

                </div>


                <h3>

                    اختر الحجم:

                </h3>


                <div class="sizes">

                    ${
                        product.sizes.length
                        ?
                        product.sizes.map(size => {

                            const selected =
                            Number(currentSize?.id)
                            ===
                            Number(size.id);


                            const original =
                            Number(size.price || 0);


                            const final =
                            getFinalPrice(size);


                            const discount =
                            getDiscount(size);


                            return `

                                <button
                                    class="${selected ? "sel" : ""}"
                                    onclick="pickSize(${Number(size.id)})"
                                >

                                    <b>
                                        ${Number(size.size_ml)} ml
                                    </b>


                                    ${
                                        discount > 0
                                        ?
                                        `
                                            <span class="size-old-price">
                                                ${money(original)}
                                            </span>

                                            <span class="size-final-price">
                                                ${money(final)}
                                            </span>
                                        `
                                        :
                                        `
                                            <span class="size-final-price">
                                                ${money(final)}
                                            </span>
                                        `
                                    }

                                </button>

                            `;

                        }).join("")
                        :
                        `
                            <p>
                                لا توجد أحجام متاحة لهذا المنتج.
                            </p>
                        `
                    }

                </div>


                <h3 style="margin-top:20px;">

                    الكمية:

                </h3>


                <div class="qty">

                    <button
                        onclick="
                            qty=Math.max(1,qty-1);
                            render();
                        "
                    >
                        −
                    </button>


                    <b>
                        ${qty}
                    </b>


                    <button
                        onclick="
                            qty++;
                            render();
                        "
                    >
                        +
                    </button>

                </div>


                <div class="btn-actions-row">


                    <button
                        class="btn-cart"
                        onclick="addToCart()"
                        ${!currentSize ? "disabled" : ""}
                    >

                        🛒 إضافة للسلة

                    </button>


                    ${
                        currentSize
                        ?
                        `
                            <a
                                class="btn-whatsapp-direct"
                                href="${buildWhatsAppOrderLink()}"
                                target="_blank"
                                rel="noopener"
                            >

                                💬 طلب فوري عبر WhatsApp

                            </a>
                        `
                        :
                        ""
                    }


                </div>

            </div>

        </div>

    `;

}


/* =========================
   SIZE
========================= */

function pickSize(id){

    currentSize =
    product.sizes.find(
        size =>
        Number(size.id)
        ===
        Number(id)
    );


    render();

}


/* =========================
   COPY
========================= */

function copyLink(){

    if(
        navigator.clipboard
    ){

        navigator.clipboard
        .writeText(
            window.location.href
        )
        .then(() => {

            alert(
                "✅ تم نسخ رابط المنتج"
            );

        });

    }

}


/* =========================
   WHATSAPP
========================= */

function normalizeWhatsApp(number){

    let value =
    String(number || "")
    .replace(/\D/g,"");


    if(value.startsWith("0")){

        value =
        "20" +
        value.substring(1);

    }


    return value;

}


function buildWhatsAppOrderLink(){

    const number =
    normalizeWhatsApp(
        storeSettings?.whatsapp
    );


    if(!number){

        return "#";

    }


    const finalPrice =
    getFinalPrice(
        currentSize
    );


    const total =
    finalPrice *
    qty;


    const message =

`🛍️ طلب من الوسام للعطور

🧴 المنتج: ${product.name}
📏 الحجم: ${currentSize.size_ml} ml
🔢 الكمية: ${qty}
💰 السعر: ${money(finalPrice)}
📦 الإجمالي: ${money(total)}

أرغب في طلب المنتج.`;



    return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

}


/* =========================
   CART
========================= */

function addToCart(){

    if(!currentSize){

        alert(
            "من فضلك اختر الحجم أولاً"
        );

        return;

    }


    let cart =
    JSON.parse(
        localStorage.getItem(
            "wissam_cart"
        )
        ||
        "[]"
    );


    const existing =
    cart.find(item =>

        Number(item.product.id)
        ===
        Number(product.id)

        &&

        Number(item.size.id)
        ===
        Number(currentSize.id)

    );


    if(existing){

        existing.qty += qty;

    }
    else{

        cart.push({

            product:{

                id:product.id,

                name:product.name,

                image:product.image

            },

            size:currentSize,

            qty:qty

        });

    }


    localStorage.setItem(
        "wissam_cart",
        JSON.stringify(cart)
    );


    window.location.href =
    "index.html";

}


/* =========================
   START
========================= */

initTheme();

loadSettings();

loadProductDetails();

</script>

</body>
</html>
