<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تفاصيل العطر | الوسام للعطور</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .product-page-container {
      max-width: 1050px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }
    .back-nav {
      margin-bottom: 20px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      background: var(--bg-surface);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      border-color: var(--gold-main);
      transform: translateX(4px);
    }
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 40px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: var(--shadow-card);
      position: relative;
    }
    .product-gallery {
      position: relative;
      text-align: center;
    }
    .product-gallery img {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .product-info h1 {
      margin: 8px 0 12px;
      font-size: 28px;
      line-height: 1.3;
    }
    .cat-badge {
      display: inline-block;
      color: var(--gold-main);
      background: rgba(214,179,75,0.12);
      border: 1px solid var(--border-gold);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
    }
    .pricing-hero {
      margin: 18px 0;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .pricing-hero strong {
      font-size: 28px;
      color: var(--gold-main);
    }
    .pricing-hero del {
      color: var(--text-dim);
      font-size: 18px;
    }
    .discount-pill {
      background: #dc2626;
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .desc-text {
      color: var(--text-muted);
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 25px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 0;
    }
    .btn-actions-row {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }
    .btn-actions-row button, .btn-actions-row a {
      flex: 1;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn-cart {
      background: var(--gold-gradient);
      color: #080808;
    }
    .btn-whatsapp-direct {
      background: #25d366;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-whatsapp-direct:hover, .btn-cart:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
    @media(max-width: 820px){
      .product-layout {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 20px;
      }
      .product-gallery img {
        max-height: 330px;
      }
      .btn-actions-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <img src="assets/images/logo.jpg" alt="الوسام">
    <span>
      <b class="store-name">الوسام للعطور</b>
      <small class="tagline">أناقة تدوم... وعطر يميزك</small>
    </span>
  </a>

  <div class="header-actions">
    <button id="themeToggle" class="theme-btn" title="تبديل المظهر">
      <span class="theme-icon">☀️</span>
    </button>
    <a href="index.html" class="icon-action-btn" title="العودة للمتجر">
      🏠 المتجر
    </a>
  </div>
</header>

<div class="product-page-container">
  <div class="back-nav">
    <a href="index.html" class="back-btn">← العودة لتصفح جميع العطور</a>
  </div>

  <div id="productViewArea">
    <div class="empty">🧴 جاري جلب تفاصيل العطر...</div>
  </div>
</div>

<footer>
  © 2026 <span class="store-name">الوسام للعطور</span> — جميع الحقوق محفوظة | برمجة وتطوير <a href="https://wa.me/201280815067" target="_blank" rel="noopener noreferrer">✦ Ayman Abdelsanad ✦</a>
</footer>

<script>
const API_CONFIG = {
    url: "https://dbtvicvsabdypxjhafxt.supabase.co",
    anonKey: "sb_publishable_cE_nDKgQJMBczIgGph0WbA_ekFMWxlq"
};
const headers = {
    apikey: API_CONFIG.anonKey,
    Authorization: `Bearer ${API_CONFIG.anonKey}`
};
const labels = { men: "رجال", women: "نساء", unisex: "للجنسين", original: "أورجينال" };
const money = n => Number(n || 0).toLocaleString("ar-EG", { maximumFractionDigits: 2 }) + " جنيه";

let product = null;
let currentSize = null;
let qty = 1;
let storeSettings = null;

function initTheme() {
    const saved = localStorage.getItem("wissam_theme") || "dark";
    document.documentElement.setAttribute("data-theme", saved);
    const icon = document.querySelector(".theme-icon");
    if(icon) icon.textContent = saved === "dark" ? "☀️" : "🌙";

    const btn = document.getElementById("themeToggle");
    if(btn){
        btn.onclick = () => {
            const cur = document.documentElement.getAttribute("data-theme") || "dark";
            const nxt = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", nxt);
            localStorage.setItem("wissam_theme", nxt);
            if(icon) icon.textContent = nxt === "dark" ? "☀️" : "🌙";
        };
    }
}

function fp(size) {
    const price = Number(size?.price || 0);
    if (!size?.discount_enabled) return price;
    const discount = Number(size?.discount_value || 0);
    if (size.discount_type === "percent") {
        return Math.max(0, price - (price * discount / 100));
    }
    return Math.max(0, price - discount);
}

async function loadSettings() {
    try {
        const r = await fetch(`${API_CONFIG.url}/rest/v1/settings?select=*&limit=1`, { headers });
        const d = await r.json();
        if(d?.length) {
            storeSettings = d[0];
            document.querySelectorAll(".store-name").forEach(el => el.textContent = storeSettings.store_name || "الوسام للعطور");
        }
    } catch(e){}
}

async function loadProductDetails() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if(!id) {
        document.getElementById("productViewArea").innerHTML = `
          <div class="empty">
            ❌ لم يتم تحديد العطر المطلوب.<br>
            <a href="index.html" class="gold" style="margin-top:15px;">تصفح المتجر</a>
          </div>
        `;
        return;
    }

    try {
        const r = await fetch(`${API_CONFIG.url}/rest/v1/products?id=eq.${id}&select=*,product_sizes(*)`, { headers });
        const data = await r.json();
        if(!data || !data.length) {
            document.getElementById("productViewArea").innerHTML = `<div class="empty">❌ هذا العطر غير متوفر حالياً.</div>`;
            return;
        }

        product = data[0];
        product.sizes = (product.product_sizes || []).sort((a,b) => Number(a.size_ml) - Number(b.size_ml));
        currentSize = product.sizes[0] || null;
        document.title = `${product.name} | الوسام للعطور`;
        render();
    } catch(e) {
        document.getElementById("productViewArea").innerHTML = `<div class="empty">❌ حدث خطأ في التحميل: ${e.message}</div>`;
    }
}

function render() {
    const box = document.getElementById("productViewArea");
    if(!product || !box) return;

    const finalP = fp(currentSize);
    const origP = Number(currentSize?.price || 0);
    const hasDisc = currentSize?.discount_enabled && finalP < origP;

    box.innerHTML = `
      <div class="product-layout">
        <div class="product-gallery">
          <div class="badges-container" style="position:absolute; top:12px; right:12px;">
            ${storeSettings?.offer_enabled ? `<span class="badge-offer">🎁 اشترِ 2 وخد 1 هدية</span>` : ""}
            ${hasDisc ? `<span class="badge-discount">خصم فعال</span>` : ""}
          </div>
          <img src="${product.image || 'assets/images/logo.jpg'}" alt="${product.name}" onerror="this.src='assets/images/logo.jpg'">
          
          <button class="share-btn" onclick="copyLink()" style="margin-top:15px; width:100%; justify-content:center;">
            🔗 نسخ رابط العطر للمشاركة
          </button>
        </div>

        <div class="product-info">
          <span class="cat-badge">${labels[product.category] || "فاخر"}</span>
          <h1>${product.name}</h1>

          <div class="pricing-hero">
            <strong>${money(finalP)}</strong>
            ${hasDisc ? `<del>${money(origP)}</del>` : ""}
            ${hasDisc ? `<span class="discount-pill">وفرت ${money(origP - finalP)}</span>` : ""}
          </div>

          <div class="desc-text">
            ${product.description || "عطر فاخر ومميز يدوم طويلاً ومناسب لجميع الأوقات والمناسبات الخاصة."}
          </div>

          <h3>اختر الحجم المطلوب:</h3>
          <div class="sizes">
            ${product.sizes.map(s => {
              const sel = Number(currentSize?.id) === Number(s.id) ? "sel" : "";
              return `
                <button class="${sel}" onclick="pickSize(${s.id})">
                  <b>${s.size_ml} ml</b> — ${money(fp(s))}
                </button>
              `;
            }).join("")}
          </div>

          <h3 style="margin-top:20px;">الكمية:</h3>
          <div class="qty">
            <button onclick="qty = Math.max(1, qty - 1); render();">−</button>
            <b>${qty}</b>
            <button onclick="qty++; render();">+</button>
          </div>

          <div class="btn-actions-row">
            <button class="btn-cart" onclick="addToCartAndGo()">
              🛒 إضافة للسلة والشراء
            </button>
            <a class="btn-whatsapp-direct" href="${buildWhatsAppOrderLink()}" target="_blank">
              💬 طلب فوري عبر WhatsApp
            </a>
          </div>
        </div>
      </div>
    `;
}

function pickSize(id) {
    currentSize = product.sizes.find(s => Number(s.id) === Number(id));
    render();
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href);
    alert("✅ تم نسخ رابط العطر المباشر بنجاح!");
}

function buildWhatsAppOrderLink() {
    const num = storeSettings?.whatsapp || "201280815067";
    const finalP = fp(currentSize);
    const msg = `مرحباً، أود طلب عطر (${product?.name}) بحجم (${currentSize?.size_ml} ml) عدد (${qty}) بإجمالي ${money(finalP * qty)}`;
    return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

function addToCartAndGo() {
    let cart = JSON.parse(localStorage.getItem("wissam_cart") || "[]");
    const existing = cart.find(item => Number(item.product.id) === Number(product.id) && Number(item.size.id) === Number(currentSize.id));
    if (existing) {
        existing.qty += qty;
    } else {
        cart.push({
            product: { id: product.id, name: product.name, image: product.image },
            size: currentSize,
            qty: qty
        });
    }
    localStorage.setItem("wissam_cart", JSON.stringify(cart));
    window.location.href = "index.html";
}

initTheme();
loadSettings();
loadProductDetails();
</script>
</body>
</html>
